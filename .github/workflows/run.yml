name: Run Bot 24/7

on:
  push:
  schedule:
    # Запуск скрипта каждые 3 часа
    - cron: '0 */3 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Telegram Bot
      # Таймаут в 165 минут (чуть меньше 3 часов), чтобы процессы не накладывались друг на друга
      timeout-minutes: 165
      run: python bot.py
